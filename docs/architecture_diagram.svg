<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #F8F3EF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#20201F" flood-opacity="0.08" />
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#8A63F4" />
      <feStop offset="100%" stop-color="#A180F8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <feStop offset="0%" stop-color="#FFFFFF" />
      <feStop offset="100%" stop-color="#FCFAF8" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8A63F4" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#77736F" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="940" height="60" rx="12" fill="#FFFFFF" stroke="#ECE8E5" filter="url(#shadow)" />
  <text x="50" y="48" font-size="20" font-weight="700" fill="#20201F">UPI Transaction Intelligence System — System Architecture</text>
  <text x="50" y="68" font-size="13" font-weight="500" fill="#77736F">Full-Stack Data Flow: React 18 SPA → FastAPI REST Engine → SQLite3 / Apache Parquet Analytics</text>
  <rect x="850" y="35" width="100" height="28" rx="6" fill="#EDE7F6" />
  <text x="865" y="53" font-size="12" font-weight="700" fill="#5E35B1">PRODUCTION</text>

  <!-- LAYER 1: CLIENT LAYER (REACT FRONTEND) -->
  <rect x="30" y="100" width="280" height="520" rx="14" fill="url(#cardGrad)" stroke="#ECE8E5" filter="url(#shadow)" />
  <rect x="45" y="115" width="250" height="36" rx="8" fill="url(#primaryGrad)" />
  <text x="75" y="138" font-size="15" font-weight="700" fill="#FFFFFF">1. Client Layer (React 18)</text>

  <!-- Frontend modules -->
  <g transform="translate(45, 165)">
    <!-- App Shell -->
    <rect x="0" y="0" width="250" height="65" rx="8" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="12" y="24" font-size="13" font-weight="700" fill="#20201F">App Shell &amp; Sidebar</text>
    <text x="12" y="44" font-size="11" fill="#77736F">8 Functional Modules &amp; Tabs</text>
    <text x="12" y="57" font-size="10" font-family="monospace" fill="#8A63F4">App.jsx, Sidebar.jsx, Header.jsx</text>
  </g>

  <g transform="translate(45, 245)">
    <!-- Pages -->
    <rect x="0" y="0" width="250" height="95" rx="8" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="12" y="22" font-size="13" font-weight="700" fill="#20201F">Analytics Views &amp; Pages</text>
    <text x="12" y="40" font-size="11" fill="#77736F">• Dashboard &amp; Diurnal Curves</text>
    <text x="12" y="56" font-size="11" fill="#77736F">• Customer / Merchant Summaries</text>
    <text x="12" y="72" font-size="11" fill="#77736F">• Anomaly Findings &amp; Data Quality</text>
    <text x="12" y="87" font-size="10" font-family="monospace" fill="#8A63F4">Dashboard.jsx, Transactions.jsx...</text>
  </g>

  <g transform="translate(45, 355)">
    <!-- UI Components -->
    <rect x="0" y="0" width="250" height="85" rx="8" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="12" y="22" font-size="13" font-weight="700" fill="#20201F">Lightweight Visualization</text>
    <text x="12" y="40" font-size="11" fill="#77736F">• Pure SVG Diurnal Bar &amp; Area Charts</text>
    <text x="12" y="56" font-size="11" fill="#77736F">• Paginated DataTables with Sort</text>
    <text x="12" y="72" font-size="11" fill="#77736F">• Two-Step CSV Upload Modal</text>
  </g>

  <g transform="translate(45, 455)">
    <!-- API Service -->
    <rect x="0" y="0" width="250" height="75" rx="8" fill="#F5EEFE" stroke="#B9A0F5" />
    <text x="12" y="24" font-size="13" font-weight="700" fill="#5E35B1">Browser Fetch API Client</text>
    <text x="12" y="44" font-size="11" fill="#77736F">JSON &amp; Multipart/form-data</text>
    <text x="12" y="62" font-size="10" font-family="monospace" fill="#8A63F4">src/services/api.js</text>
  </g>

  <!-- ARROWS 1 -> 2 -->
  <path d="M 295 490 L 350 490 L 350 330 L 365 330" fill="none" stroke="#8A63F4" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="310" y="320" font-size="11" font-weight="600" fill="#8A63F4">HTTP / REST</text>

  <!-- LAYER 2: BACKEND & PROCESSING (FASTAPI) -->
  <rect x="370" y="100" width="290" height="520" rx="14" fill="url(#cardGrad)" stroke="#ECE8E5" filter="url(#shadow)" />
  <rect x="385" y="115" width="260" height="36" rx="8" fill="url(#primaryGrad)" />
  <text x="405" y="138" font-size="15" font-weight="700" fill="#FFFFFF">2. Backend Engine (FastAPI)</text>

  <g transform="translate(385, 165)">
    <!-- Main API Router -->
    <rect x="0" y="0" width="260" height="65" rx="8" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="12" y="24" font-size="13" font-weight="700" fill="#20201F">API Routers &amp; Middleware</text>
    <text x="12" y="44" font-size="11" fill="#77736F">CORS, Lifespan DB Init, Error Handler</text>
    <text x="12" y="57" font-size="10" font-family="monospace" fill="#8A63F4">backend/app/main.py</text>
  </g>

  <g transform="translate(385, 245)">
    <!-- Services -->
    <rect x="0" y="0" width="260" height="105" rx="8" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="12" y="22" font-size="13" font-weight="700" fill="#20201F">Domain Service Layer</text>
    <text x="12" y="40" font-size="11" fill="#77736F">• TransactionService (Parameterized)</text>
    <text x="12" y="56" font-size="11" fill="#77736F">• CustomerService (Profiles &amp; History)</text>
    <text x="12" y="72" font-size="11" fill="#77736F">• MerchantService (Peak Hour Ranking)</text>
    <text x="12" y="88" font-size="11" fill="#77736F">• DataQualityService &amp; ExportService</text>
  </g>

  <g transform="translate(385, 365)">
    <!-- Processing Pipeline -->
    <rect x="0" y="0" width="260" height="135" rx="8" fill="#F5EEFE" stroke="#B9A0F5" />
    <text x="12" y="22" font-size="13" font-weight="700" fill="#5E35B1">Processing &amp; Quality Pipeline</text>
    <text x="12" y="42" font-size="11" fill="#20201F">1. Schema Validation (7 cols check)</text>
    <text x="12" y="58" font-size="11" fill="#20201F">2. Data Cleaning &amp; Quarantine</text>
    <text x="12" y="74" font-size="11" fill="#20201F">3. Rule Anomaly Detection:</text>
    <text x="24" y="90" font-size="10" fill="#77736F">• High Value (> ₹50k)</text>
    <text x="24" y="104" font-size="10" fill="#77736F">• Velocity Spike (Burst in window)</text>
    <text x="24" y="118" font-size="10" fill="#77736F">• Z-Score Deviation (Z >= 2.5)</text>
  </g>

  <g transform="translate(385, 515)">
    <rect x="0" y="0" width="260" height="40" rx="6" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="10" y="24" font-size="11" font-family="monospace" fill="#8A63F4">ingestion.py, anomaly_detection.py</text>
  </g>

  <!-- ARROWS 2 -> 3 -->
  <path d="M 645 320 L 700 320" fill="none" stroke="#8A63F4" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="655" y="310" font-size="11" font-weight="600" fill="#8A63F4">SQL / Parquet</text>

  <!-- LAYER 3: DATA & PERSISTENCE LAYER -->
  <rect x="710" y="100" width="260" height="520" rx="14" fill="url(#cardGrad)" stroke="#ECE8E5" filter="url(#shadow)" />
  <rect x="725" y="115" width="230" height="36" rx="8" fill="url(#primaryGrad)" />
  <text x="740" y="138" font-size="15" font-weight="700" fill="#FFFFFF">3. Data &amp; Analytics Layer</text>

  <g transform="translate(725, 165)">
    <!-- SQLite Relational Storage -->
    <rect x="0" y="0" width="230" height="155" rx="8" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="12" y="24" font-size="13" font-weight="700" fill="#20201F">SQLite3 Storage Engine</text>
    <text x="12" y="44" font-size="11" fill="#77736F">• WAL Mode enabled</text>
    <text x="12" y="60" font-size="11" fill="#77736F">• raw_transactions (immutable)</text>
    <text x="12" y="76" font-size="11" fill="#77736F">• cleaned_transactions (indexed)</text>
    <text x="12" y="92" font-size="11" fill="#77736F">• quarantined_transactions</text>
    <text x="12" y="108" font-size="11" fill="#77736F">• anomaly_findings (audit log)</text>
    <text x="12" y="124" font-size="11" fill="#77736F">• data_quality_reports</text>
    <text x="12" y="142" font-size="10" font-family="monospace" fill="#8A63F4">data/upi_transactions.db</text>
  </g>

  <g transform="translate(725, 335)">
    <!-- SQL Analytics -->
    <rect x="0" y="0" width="230" height="135" rx="8" fill="#FAF8F6" stroke="#ECE8E5" />
    <text x="12" y="24" font-size="13" font-weight="700" fill="#20201F">SQL CTE &amp; Window Logic</text>
    <text x="12" y="44" font-size="11" fill="#77736F">• LAG(): DoD volume growth %</text>
    <text x="12" y="60" font-size="11" fill="#77736F">• Rolling 3-day moving average</text>
    <text x="12" y="76" font-size="11" fill="#77736F">• DENSE_RANK(): Spend / Volume</text>
    <text x="12" y="92" font-size="11" fill="#77736F">• ROW_NUMBER(): Top categories</text>
    <text x="12" y="108" font-size="11" fill="#77736F">• SUM() OVER(): Share ratios</text>
    <text x="12" y="126" font-size="10" font-family="monospace" fill="#8A63F4">backend/app/database/queries.py</text>
  </g>

  <g transform="translate(725, 485)">
    <!-- Columnar Parquet Engine -->
    <rect x="0" y="0" width="230" height="75" rx="8" fill="#EDE7F6" stroke="#5E35B1" />
    <text x="12" y="24" font-size="13" font-weight="700" fill="#5E35B1">Apache Parquet Export</text>
    <text x="12" y="42" font-size="11" fill="#77736F">High-speed columnar storage</text>
    <text x="12" y="58" font-size="10" font-family="monospace" fill="#5E35B1">data/processed/*.parquet</text>
  </g>

  <!-- Return Data Arrow -->
  <path d="M 710 420 L 665 420" fill="none" stroke="#77736F" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrowMuted)" />
  <path d="M 370 420 L 320 420" fill="none" stroke="#77736F" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrowMuted)" />
  <text x="330" y="412" font-size="10" font-weight="600" fill="#77736F">JSON</text>
</svg>
